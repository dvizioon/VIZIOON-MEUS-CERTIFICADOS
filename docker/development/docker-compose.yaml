services:
  app:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      args:
        APP_PORT: ${PORT:-5560}
        APP_ENV: ${APP_ENV:-development}
    container_name: certificados-daniel
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: ${PORT:-5560}
      HOSTNAME: ${HOSTNAME:-0.0.0.0}
      APP_ENV: ${APP_ENV:-development}
      NODE_ENV: production
    ports:
      - "${PORT:-5560}:${PORT:-5560}"
