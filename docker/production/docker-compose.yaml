services:
  app:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      args:
        APP_PORT: ${PORT:-3000}
        APP_ENV: ${APP_ENV:-production}
    container_name: certificados-daniel
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: ${PORT:-3000}
      HOSTNAME: ${HOSTNAME:-0.0.0.0}
      APP_ENV: ${APP_ENV:-production}
      NODE_ENV: production
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
